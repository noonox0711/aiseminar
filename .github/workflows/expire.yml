# 공개 기간이 끝난 자료를 "기간 종료 후" 잠금본으로 바꾼다.
# _expire/<YYYY-MM-DD>/ 아래 파일을, 그 날짜(한국 시간)가 되면 저장소 루트의 같은 경로에 덮어쓴다.
# 예) _expire/2026-11-01/260930/index.html  →  11월 1일에 260930/index.html 을 교체
name: expire

on:
  schedule:
    - cron: '5 15 * * *'   # 매일 00:05 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 기간이 지난 폴더 교체
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          changed=0
          for d in _expire/*/; do
            [ -d "$d" ] || continue
            day=$(basename "$d")
            if [[ ! "$day" > "$today" ]]; then
              echo "교체: $day"
              cp -R "$d". .
              rm -rf "$d"
              changed=1
            fi
          done
          if [ "$changed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "공개 기간 종료: 잠금본 교체 ($today)"
            git push
          else
            echo "오늘($today) 교체할 것 없음"
          fi
