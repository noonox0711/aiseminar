const KEEP='aiseminar:260930';   // 같은 날짜 폴더의 페이지끼리 비번 기억을 공유
function b64d(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function dec(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(ENC.iv)},key,b64d(ENC.ct));
  return new TextDecoder().decode(pt);
}
async function unlock(pw){
  try{const html=await dec(pw);try{localStorage.setItem(KEEP,pw);}catch(e){}
    document.open();document.write(html);document.close();return true;}
  catch(e){return false;}
}
const $=id=>document.getElementById(id);
$('f').addEventListener('submit',async function(ev){ev.preventDefault();
  const pw=$('pw').value.trim().toLowerCase();if(!pw)return;
  $('go').disabled=true;$('go').textContent='여는 중…';
  const ok=await unlock(pw);
  if(!ok){$('go').disabled=false;$('go').textContent='열기';$('e').hidden=false;$('pw').value='';$('pw').focus();}
});
(async function(){let s=null;try{s=localStorage.getItem(KEEP);}catch(e){}
  if(!s)return;
  if(!(await unlock(s))){try{localStorage.removeItem(KEEP);}catch(e){} $('e').hidden=false;}
})();
</script></body></html>
